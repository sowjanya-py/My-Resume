<style>
  :root {
    --bg: #F4F6FA;
    --surface: #FFFFFF;
    --ink: #141B2D;
    --muted: #566075;
    --line: #D9DEE8;
    --fs: #1F5FD1;
    --ml: #C2306B;
    --accent: var(--fs);
    --on-accent: #FFFFFF;
    --display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1420; --surface: #171E2E; --ink: #E8ECF5; --muted: #9AA5BC; --line: #2A3347;
      --fs: #86AEFF; --ml: #FF93BC; --on-accent: #0F1420;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1420; --surface: #171E2E; --ink: #E8ECF5; --muted: #9AA5BC; --line: #2A3347;
    --fs: #86AEFF; --ml: #FF93BC; --on-accent: #0F1420;

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: 5rem; }
  body {

    font-family: var(--body); font-size: 1rem; line-height: 1.6;

  }
  body[data-mode="ml"] { --accent: var(--ml); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }

  .skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--on-accent); padding: 0.6rem 1rem; z-index: 50; }
  .skip:focus { left: 0.5rem; top: 0.5rem; }

  .icon { display: inline-flex; flex: none; }

  /* Shell */
  .app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 17rem minmax(0, 1fr); }
  .side {
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    background: var(--surface); border-right: 1px solid var(--line);
    padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.5rem;
  }
  .content { min-width: 0; }
  .topbar, .tabbar { display: none; }
  main { max-width: 66rem; padding: 2.75rem 2.5rem 4rem; outline: none; }

  .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
  .badge {
    width: 2.5rem; height: 2.5rem; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    font-family: var(--display); font-weight: 800; letter-spacing: -0.02em;
  }
  .brand-name { font-family: var(--display); font-weight: 800; font-size: 1.1rem; line-height: 1.15; letter-spacing: -0.02em; display: block; }
  .brand-sub { color: var(--muted); font-size: 0.85rem; display: block; }

  .lens { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .lens-btn {
    appearance: none; border: 0; background: none; cursor: pointer;
    padding: 0.5rem 0.4rem; border-radius: 7px; font-weight: 600; font-size: 0.85rem; line-height: 1.25; color: var(--muted);
  }
  .lens-btn:hover { color: var(--ink); }
  .lens-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-link {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem;
    border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500;
  }
  .nav-link:hover { background: var(--bg); color: var(--ink); }
  .nav-link[aria-current="page"] { background: var(--bg); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }

  .side-foot { margin-top: auto; display: grid; gap: 0.5rem; }
  .tool {
    appearance: none; cursor: pointer; display: flex; align-items: center; gap: 0.6rem;
    width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--line); background: var(--bg);
    border-radius: 8px; color: var(--muted); font-size: 0.9rem; text-align: left;
  }
  .tool:hover { color: var(--ink); }
  .tool kbd { margin-left: auto; font: 500 0.75rem var(--body); border: 1px solid var(--line); border-radius: 5px; padding: 0.05rem 0.4rem; background: var(--surface); }

  /* Mobile shell */
  @media (max-width: 55.99rem) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .topbar {
      display: grid; gap: 0.6rem; position: sticky; top: 0; z-index: 20;
      background: var(--bg); border-bottom: 1px solid var(--line);
      padding: calc(0.6rem + env(safe-area-inset-top, 0px)) 1rem 0.6rem;
    }
    .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .topbar .badge { width: 2.1rem; height: 2.1rem; font-size: 0.85rem; }
    .iconbtn { appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 2.4rem; height: 2.4rem; display: grid; place-items: center; color: var(--muted); }
    .topbar-tools { display: flex; gap: 0.5rem; }
    .tabbar {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--surface); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tab-link {
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      padding: 0.5rem 0.1rem 0.45rem; text-decoration: none; color: var(--muted);
      font-size: 0.66rem; font-weight: 500; line-height: 1.2;
    }
    .tab-link[aria-current="page"] { color: var(--accent); font-weight: 600; }
    main { padding: 1.5rem 1.1rem calc(6rem + env(safe-area-inset-bottom, 0px)); }
  }
  @media (min-width: 56rem) { .topbar-only { display: none; } }

  /* Typography in views */
  .h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 5.5vw, 3.2rem); line-height: 1.02; letter-spacing: -0.03em; margin: 0; }
  .h2 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; margin: 2rem 0 0.6rem; }
  .lede { color: var(--muted); margin: 0.6rem 0 0; max-width: 60ch; }
  .pitch { font-family: var(--display); font-weight: 600; font-size: clamp(1.3rem, 3vw, 1.85rem); line-height: 1.25; letter-spacing: -0.015em; margin: 1.1rem 0 0; max-width: 32ch; }
  .summary { margin: 1rem 0 0; max-width: 62ch; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.4rem; margin-top: 1.6rem; }
  .btn {
    appearance: none; border: 0; cursor: pointer; display: inline-block; text-decoration: none;
    background: var(--accent); color: var(--on-accent); font: 600 1rem/1 var(--body);
    padding: 0.9rem 1.3rem; border-radius: 8px;

  .btn:hover { filter: brightness(1.08); }
  .btn.quiet { background: none; color: var(--ink); border: 1px solid var(--line); }
  .link { font-weight: 500; text-underline-offset: 4px; text-decoration-thickness: 2px; text-decoration-color: var(--accent); }

  .glance { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-width: 46rem; }
  .glance li { border-bottom: 1px solid var(--line); }
  .glance a, .glance span.row { display: block; padding: 0.8rem 0.25rem; text-decoration: none; }
  .glance a:hover { background: var(--surface); }
  .glance b { font-weight: 600; }

  /* Projects master-detail */
  .md { display: grid; grid-template-columns: minmax(0, 21rem) minmax(0, 1fr); gap: 2.25rem; align-items: start; margin-top: 1.5rem; }
  .tools { display: grid; gap: 0.75rem; margin-bottom: 0.75rem; }
  .search {
    width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    appearance: none; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.88rem; color: var(--muted);
  }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

  .plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .prow {
    display: block; text-decoration: none; padding: 0.85rem 0.95rem; border-radius: 8px;
    border: 1px solid transparent; box-shadow: inset 3px 0 0 transparent;
  }
  .prow:hover { background: var(--surface); }
  .prow[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent); }
  .prow-title { font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.25; display: block; }
  .prow-meta { color: var(--muted); font-size: 0.88rem; display: block; margin-top: 0.1rem; }
  .empty { color: var(--muted); padding: 1rem 0.25rem; margin: 0; }

  .detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.75rem 1.75rem 1.5rem; min-height: 14rem; }
  .detail-title { font-family: var(--display); font-weight: 800; font-size: clamp(1.5rem, 3.4vw, 2.1rem); line-height: 1.1; letter-spacing: -0.025em; margin: 0; }
  .meta { margin: 0.3rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.9rem 0 0; padding: 0; list-style: none; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.7rem; font-size: 0.85rem; color: var(--muted); }
  .points { margin: 1rem 0 0; padding-left: 1.1rem; max-width: 62ch; }
  .points li { margin: 0.35rem 0; }
  .points li::marker { color: var(--accent); }
  .stack { margin: 1rem 0 0; color: var(--muted); font-size: 0.95rem; }
  .stack b { color: var(--ink); font-weight: 600; }
  .detail-links { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; margin-top: 1rem; }
  .pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.95rem; }
  .pager a { text-decoration: none; color: var(--muted); max-width: 48%; }
  .pager a:hover { color: var(--ink); }
  .back { display: none; align-items: center; gap: 0.25rem; margin-bottom: 1rem; color: var(--muted); text-decoration: none; font-weight: 500; }

    .md[data-detail="true"] .md-list { display: none; }
    .md[data-detail="false"] .md-detail { display: none; }

  /* Skills */
  .skillgroups { display: grid; gap: 1.4rem; margin-top: 1.5rem; }
  .skillgroup h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.5rem; color: var(--muted); }
  .skillpanel { position: sticky; bottom: 1rem; margin-top: 1.75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.25rem; min-height: 5rem; }

  .xps { margin-top: 1.5rem; border-top: 1px solid var(--line); max-width: 46rem; }
  .xp { border-bottom: 1px solid var(--line); }
  .xp summary { list-style: none; cursor: pointer; padding: 1rem 0.25rem; display: block; }
  .xp summary::-webkit-details-marker { display: none; }
  .xp summary:hover { background: var(--surface); }
  .xp-role { font-family: var(--display); font-weight: 600; font-size: 1.2rem; line-height: 1.25; display: block; }
  .xp-meta { color: var(--muted); font-size: 0.92rem; display: block; margin-top: 0.1rem; }
  .xp-body { margin: 0; padding: 0 0.25rem 1.1rem; max-width: 60ch; }

  .plain { margin: 0.4rem 0 0; padding-left: 1.1rem; max-width: 62ch; }
  .plain li { margin: 0.3rem 0; }
  .plain li::marker { color: var(--accent); }
  .block { margin-top: 1.5rem; }
  .block .item-title { font-family: var(--display); font-weight: 600; font-size: 1.25rem; margin: 0; }

  /* Resume viewer */
  .preview { margin-top: 1.5rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .preview iframe { display: block; width: 100%; height: 80vh; min-height: 32rem; border: 0; }
  @media (max-width: 55.99rem) { .preview { display: none; } }

  /* Command palette */
  .pal { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 24, 0.55); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 1rem 1rem; }
  .pal-box { width: min(36rem, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
  .pal-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-size: 1.05rem; padding: 1rem 1.1rem; outline: none; }
  .pal-list { list-style: none; margin: 0; padding: 0.4rem; max-height: 50vh; overflow-y: auto; }
  .pal-item { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0.75rem; border-radius: 8px; cursor: pointer; }
  .pal-item[aria-selected="true"] { background: var(--bg); box-shadow: inset 3px 0 0 var(--accent); }
  .pal-hint { color: var(--muted); font-size: 0.85rem; flex: none; }
  .pal-empty { padding: 1rem 0.75rem; color: var(--muted); }

  .enter { animation: enter 200ms ease-out; }
  @keyframes enter { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
</style>

      var typing = tag === "INPUT" || tag === "TEXTAREA" || (e.target && e.target.isContentEditable);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if ($("pal").hidden) openPalette(); else closePalette(); }
      else if (e.key === "/" && !typing && $("pal").hidden) { e.preventDefault(); openPalette(); }
    });
  }

  /* ---------- init ---------- */
  function init() {
    var theme = safeRead("theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);

    var fromUrl = null;
    try { fromUrl = new URL(location.href).searchParams.get("mode"); } catch (e) {}
    var saved = safeRead("mode");
    var pick = [fromUrl, saved].filter(function (m) { return m === "ml" || m === "fullstack"; })[0];
    state.mode = pick || "fullstack";

    buildNav();
    buildTools();
    bindPalette();
    window.addEventListener("hashchange", function () { onRoute(true); });
    if (desktopQuery.addEventListener) desktopQuery.addEventListener("change", function () { render(false); });
    onRoute(false);
  }

  init();
})();
</script>
</body>
</html>
